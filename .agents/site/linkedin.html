<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentFlow · LinkedIn drafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  .draft-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .draft-card .draft-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .draft-card h3 { font-size: 18px; }
  .draft-card .draft-stats {
    display: flex;
    gap: 10px;
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
  }
  .draft-card .draft-body {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary);
    background: var(--surface-0);
    border: 1px solid var(--border);
    padding: 20px 22px;
    border-radius: 6px;
  }
  .draft-card .draft-notes {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .draft-card .lang-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .draft-card .lang-tab {
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    background: transparent;
    font-family: inherit;
    letter-spacing: 0.06em;
  }
  .draft-card .lang-tab.active { border-color: var(--accent); color: var(--accent); }
  .draft-shot {
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .draft-shot img { display: block; width: 100%; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="./index.html" class="nav-brand"><span class="nav-brand-dot"></span>AGENTFLOW</a>
    <div class="nav-links">
      <a href="./index.html">Overview</a>
      <a href="./blog.html">Blog</a>
      <a href="./linkedin.html" class="active">LinkedIn drafts</a>
      <a href="https://github.com/harun-yardimci/agentflow" class="nav-badge">GITHUB →</a>
    </div>
  </div>
</nav>

<section class="hero" style="padding: 64px 0 32px;">
  <div class="wrap-narrow">
    <span class="eyebrow">LINKEDIN DRAFTS · READY TO POST</span>
    <h1>LinkedIn drafts</h1>
    <p class="lead">Two posts. Launch announcement + worktree deep-dive follow-up. Both in EN and TR. Each post links to <a href="https://github.com/harun-yardimci/agentflow">github.com/harun-yardimci/agentflow</a>.</p>
  </div>
</section>

<section class="section" style="padding-top: 32px;">
  <div class="wrap-narrow" id="drafts-root">
    <div class="muted">Loading drafts…</div>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <div>AgentFlow · v1.0.0 · Apache-2.0</div>
    <div><a href="./index.html">← Overview</a></div>
  </div>
</footer>

<script>
  const DRAFTS = [
    {
      id: 'post-01',
      file: 'post-01-announcement.md',
      title: 'Post #1 — Build-in-public announcement',
      asset: 'pipeline-board-multi-agent.png',
      assetCaption: 'Attach this image: 17 tasks, 5 agents, $59 run.',
    },
    {
      id: 'post-02',
      file: 'post-02-worktree-deep-dive.md',
      title: 'Post #2 — Worktree deep-dive follow-up',
      asset: 'crew-directory.png',
      assetCaption: 'Attach this image: 9 crew members across 4 models.',
    },
  ];

  function extractSections(md) {
    const en  = md.match(/## Primary version \(English\)\s+([\s\S]*?)(?=^## )/m);
    const tr  = md.match(/## Turkish variant.*?\n([\s\S]*?)(?=^## )/m);
    const notes = md.match(/## Notes for posting\s+([\s\S]*?)$/m);
    return {
      en: en  ? en[1].trim()  : '',
      tr: tr  ? tr[1].trim()  : '',
      notes: notes ? notes[1].trim() : '',
    };
  }

  function countWords(s) { return s.split(/\s+/).filter(Boolean).length; }

  async function renderDraft(d, root) {
    const res = await fetch('./content/' + d.file);
    const md = await res.text();
    const sec = extractSections(md);
    const wc = countWords(sec.en);

    const el = document.createElement('div');
    el.className = 'draft-card';
    el.innerHTML = `
      <div class="draft-head">
        <div>
          <h3>${d.title}</h3>
        </div>
        <div class="draft-stats">
          <span>${wc} WORDS (EN)</span>
          <span>· LAUNCH</span>
          <span>· GITHUB CTA</span>
        </div>
      </div>

      <div class="lang-tabs">
        <button class="lang-tab active" data-lang="en">ENGLISH</button>
        <button class="lang-tab" data-lang="tr">TÜRKÇE</button>
      </div>

      <div class="draft-body" data-body>${sec.en}</div>

      <div class="draft-shot">
        <img src="./assets/${d.asset}" alt="${d.assetCaption}" />
      </div>

      <div class="draft-notes">${marked.parse(sec.notes || '')}</div>
    `;

    const body = el.querySelector('[data-body]');
    el.querySelectorAll('.lang-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        el.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        body.textContent = tab.dataset.lang === 'en' ? sec.en : sec.tr;
      });
    });

    root.appendChild(el);
  }

  (async () => {
    const root = document.getElementById('drafts-root');
    root.innerHTML = '';
    for (const d of DRAFTS) await renderDraft(d, root);
  })();
</script>

</body>
</html>
